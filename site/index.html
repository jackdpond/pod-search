<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BibleProject Podcast Navigator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>BibleProject</h1>
      </div>
      <nav id="series-nav">
        <!-- Series and episodes will be injected here by JS -->
      </nav>
    </aside>
    <main class="main-content">
      <h2 class="main-title">BibleProject <span class="highlight">Connections</span></h2>
      <p class="subtitle">Try searching: <em>Exodus</em> or <em>Tree of Life</em></p>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search the episodes...">
        <button id="search-btn">🔍</button>
      </div>
      <div id="search-results"></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
